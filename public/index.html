            <option value="MY">🇲🇾 Малайзия</option>
            <option value="PH">🇵🇭 Филиппины</option>
            <option value="AU">🇦🇺 Австралия</option>
            <option value="NZ">🇳🇿 Новая Зеландия</option>
            <option value="BR">🇧🇷 Бразилия</option>
            <option value="MX">🇲🇽 Мексика</option>
            <option value="AR">🇦🇷 Аргентина</option>
            <option value="CL">🇨🇱 Чили</option>
            <option value="CO">🇨🇴 Колумбия</option>
            <option value="ZA">🇿🇦 ЮАР</option>
            <option value="EG">🇪🇬 Египет</option>

        <label for="searchGenderSelect">
            Кого ищем по полу

        <select id="searchGenderSelect">

            <option value="any">
                👥 Любой пол
            </option>

            <option value="male">
                👨 Мужчина
            </option>

            <option value="female">
                👩 Женщина
            </option>

                Пол не указан
            </option>

        </select>

        <div id="partnerInfo">
            Собеседник ещё не найден
        </div>

        <div class="chat-actions">

            <button
                id="findBtn"
                class="main-button"
            >
                🔎 Найти собеседника
            </button>

            </button>

<script>
    /*
     * Глобальное состояние пользователя.
     * app.js использует ту же переменную.
     */
    var currentUser = null;

    const sidebarToggle =
        document.getElementById("sidebarToggle");

    const sidebarClose =
        document.getElementById("sidebarClose");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");

    const chatSidebar =
        document.getElementById("chatSidebar");

    function openSidebar() {
        chatSidebar.classList.add("open");
        sidebarOverlay.classList.add("open");
        chatSidebar.setAttribute("aria-hidden", "false");
    }

    function closeSidebar() {
        chatSidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
        chatSidebar.setAttribute("aria-hidden", "true");
    }

    sidebarToggle.addEventListener("click", openSidebar);
    sidebarClose.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeSidebar();
        }
    });

    const modal =
        document.getElementById("authModal");

    const title =
        document.getElementById("authTitle");

    const username =
        document.getElementById("authUsername");

    const password =
        document.getElementById("authPassword");

    const authGender =
        document.getElementById("authGender");

    const message =
        document.getElementById("authMessage");

    const submit =
        document.getElementById("authSubmit");

    const loginBtn =
        document.getElementById("loginBtn");

    const registerBtn =
        document.getElementById("registerBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    document
        .getElementById("sidebarLogin")
        .addEventListener("click", function () {
            closeSidebar();
            loginBtn.click();
        });

    document
        .getElementById("sidebarRegister")
        .addEventListener("click", function () {
            closeSidebar();
            registerBtn.click();
        });

    document
        .getElementById("sidebarLogout")
        .addEventListener("click", function () {
            closeSidebar();
            logoutBtn.click();
        });

    document
        .getElementById("sidebarProfile")
        .addEventListener("click", function () {
            const panel =
                document.getElementById("sidebarProfilePanel");

            if (panel.style.display === "none") {
                panel.style.display = "block";
            } else {
                panel.style.display = "none";
            }
        });

    const authGuest =
        document.getElementById("authGuest");

    const authUser =
        document.getElementById("authUser");



    let mode = "login";


    function openAuth(newMode) {

        mode = newMode;

        title.textContent =
            mode === "login"
                ? "Войти"
                : "Регистрация";

        submit.textContent =
            mode === "login"
                ? "Войти"
                : "Зарегистрироваться";

        username.value = "";
        password.value = "";
        message.textContent = "";

        authGender.value = "";

        authGender.style.display =
            mode === "register"
                ? "block"
                : "none";

        modal.classList.add("active");

        username.focus();
    }


    function closeAuth() {

        modal.classList.remove("active");
    }


    function updateAuthUI() {

        const sidebarUserName =
            document.getElementById("sidebarUserName");

        const sidebarUserStatus =
            document.getElementById("sidebarUserStatus");

        const sidebarLogin =
            document.getElementById("sidebarLogin");

        const sidebarRegister =
            document.getElementById("sidebarRegister");

        const sidebarLogout =
            document.getElementById("sidebarLogout");

        if (currentUser) {

            sidebarUserName.textContent =
                "👤 " + currentUser.username;

            sidebarUserStatus.textContent =
                "Вы вошли в аккаунт";

            document.getElementById("sidebarProfileUsername").textContent =
                currentUser.username || "—";

            document.getElementById("sidebarProfileCountry").textContent =
                currentUser.country || "—";

            document.getElementById("sidebarProfileGender").textContent =
                currentUser.gender || "—";

            sidebarLogin.style.display = "none";
            sidebarRegister.style.display = "none";
            sidebarLogout.style.display = "block";

            authGuest.style.display = "none";
            loginBtn.style.display = "none";
            registerBtn.style.display = "none";

            authUser.style.display = "inline";
            logoutBtn.style.display = "inline";

            authUser.textContent =
                "👤 " + currentUser.username;

            if (currentUser.country) {
                countrySelect.value =
                    currentUser.country;
            }

            if (currentUser.gender) {
                genderSelect.value =
                    currentUser.gender;
            }

        } else {

            sidebarUserName.textContent =
                "Гость";

            sidebarUserStatus.textContent =
                "Войдите в аккаунт";

            document.getElementById("sidebarProfileUsername").textContent =
                "—";

            document.getElementById("sidebarProfileCountry").textContent =
                "—";

            document.getElementById("sidebarProfileGender").textContent =
                "—";

            sidebarLogin.style.display = "block";
            sidebarRegister.style.display = "block";
            sidebarLogout.style.display = "none";

            authGuest.style.display = "inline";
            loginBtn.style.display = "inline";
            registerBtn.style.display = "inline";

            authUser.style.display = "none";
            logoutBtn.style.display = "none";
        }
    }


    async function checkSession() {

        try {

            const response =
                await fetch(
                    "/api/me",
                    {
                        method: "GET",
                        credentials: "same-origin"
                    }
                );

            const data =
                await response.json();

            if (
                response.ok &&
                data.authenticated &&
                data.user
            ) {

                currentUser = data.user;

                updateAuthUI();

                if (
                    typeof requestUserLocation ===
                    "function"
                ) {
                    requestUserLocation();
                }

            } else {

                currentUser = null;
                updateAuthUI();
            }

        } catch (error) {

            console.error(
                "Ошибка проверки авторизации:",
                error
            );

            currentUser = null;
            updateAuthUI();
        }
    }


    loginBtn.addEventListener(
        "click",
        function () {
            openAuth("login");
        }
    );


    registerBtn.addEventListener(
        "click",
        function () {
            openAuth("register");
        }
    );


    document
        .getElementById("authClose")
        .addEventListener(
            "click",
            closeAuth
        );


    logoutBtn.addEventListener(
        "click",
        async function () {

            logoutBtn.disabled = true;

            try {

                const response =
                    await fetch(
                        "/api/logout",
                        {
                            method: "POST",
                            credentials: "same-origin"
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data.error ||
                        "Ошибка выхода"
                    );
                }

                currentUser = null;

                updateAuthUI();

            } catch (error) {

                console.error(
                    "Ошибка выхода:",
                    error
                );

                alert(
                    error.message ||
                    "Не удалось выйти"
                );

            } finally {

                logoutBtn.disabled = false;
            }
        }
    );


    submit.addEventListener(
        "click",
        async function () {

            const name =
                username.value.trim();

            const pass =
                password.value;

            if (!name || !pass) {

                message.textContent =
                    "Введите логин и пароль";

                return;
            }

            if (
                mode === "register" &&
                !authGender.value
            ) {

                message.textContent =
                    "Выберите пол";

                return;
            }

            submit.disabled = true;

            message.textContent =
                "Подождите...";

            try {

                const endpoint =
                    mode === "login"
                        ? "/api/login"
                        : "/api/register";

                const requestData = {
                    username: name,
                    password: pass,
                    country:
                        countrySelect.value ||
                        "unknown"
                };

                /*
                 * Пол передаём ТОЛЬКО при регистрации.
                 * После регистрации он берётся из PostgreSQL.
                 */
                if (mode === "register") {
                    requestData.gender =
                        authGender.value;
                }

                const response =
                    await fetch(
                        endpoint,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body:
                                JSON.stringify(
                                    requestData
                                )
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Ошибка сервера"
                    );
                }

                currentUser =
                    data.user;

                updateAuthUI();

                message.textContent =
                    mode === "login"
                        ? "Вход выполнен!"
                        : "Регистрация выполнена!";

                setTimeout(
                    closeAuth,
                    700
                );

            } catch (error) {

                console.error(
                    "Ошибка авторизации:",
                    error
                );

                message.textContent =
                    error.message ||
                    "Ошибка сервера";

            } finally {

                submit.disabled = false;
            }
        }
    );


    modal.addEventListener(
        "click",
        function (event) {

            if (event.target === modal) {
                closeAuth();
            }
        }
    );


    authGender.style.display = "none";

    updateAuthUI();

    checkSession();
</script>

<script>window.addEventListener("error",function(e){window.__APP_ERROR__=e.message+" | строка "+e.lineno+" | колонка "+e.colno;var s=document.getElementById("status");if(s)s.textContent="JS ОШИБКА: "+e.message+" | строка "+e.lineno+" ❌";console.error(e.message,e.filename,e.lineno,e.colno);});window.addEventListener("unhandledrejection",function(e){var s=document.getElementById("status");if(s)s.textContent="JS PROMISE ОШИБКА: "+(e.reason&&e.reason.message?e.reason.message:e.reason)+" ❌";console.error(e.reason);});</script>
<script>window.__APP_ERROR__="";window.addEventListener("error",function(e){window.__APP_ERROR__=e.message+" | строка "+e.lineno+" | колонка "+e.colno});window.addEventListener("unhandledrejection",function(e){window.__APP_ERROR__="PROMISE: "+(e.reason&&e.reason.message?e.reason.message:e.reason)});</script>
<script src="app.js"></script>
