<script>
(function () {

    const modal = document.getElementById("authModal");
    const title = document.getElementById("authTitle");
    const username = document.getElementById("authUsername");
    const password = document.getElementById("authPassword");
    const message = document.getElementById("authMessage");
    const submit = document.getElementById("authSubmit");

    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const authGuest = document.getElementById("authGuest");
    const authUser = document.getElementById("authUser");

    let mode = "login";
    let currentUser = null;


    function openAuth(newMode) {

        mode = newMode;

        title.textContent =
            mode === "login"
                ? "Войти"
                : "Регистрация";

        submit.textContent =
            mode === "login"
                ? "Войти"
                : "Зарегистрироваться";

        username.value = "";
        password.value = "";
        message.textContent = "";

        modal.classList.add("active");

        username.focus();
    }


    function closeAuth() {
        modal.classList.remove("active");
    }


    function updateAuthUI() {

        if (currentUser) {

            authGuest.style.display = "none";
            loginBtn.style.display = "none";
            registerBtn.style.display = "none";

            authUser.style.display = "inline";
            logoutBtn.style.display = "inline";

            authUser.textContent =
                "👤 " + currentUser.username;

        } else {

            authGuest.style.display = "inline";
            loginBtn.style.display = "inline";
            registerBtn.style.display = "inline";

            authUser.style.display = "none";
            logoutBtn.style.display = "none";
        }
    }


    async function checkSession() {

        try {

            const response = await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            const data = await response.json();

            if (
                response.ok &&
                data.authenticated &&
                data.user
            ) {
                currentUser = data.user;

                requestUserLocation();

                if (countrySelect && currentUser.country) {
                    countrySelect.value = currentUser.country;
                }

                if (genderSelect && currentUser.gender) {
                    genderSelect.value = currentUser.gender;
                }

            } else {
                currentUser = null;
            }

        } catch (error) {

            console.error(
                "Ошибка проверки авторизации:",
                error
            );

            currentUser = null;
        }

        updateAuthUI();
    }


    loginBtn.addEventListener(
        "click",
        function () {
            openAuth("login");
        }
    );


    registerBtn.addEventListener(
        "click",
        function () {
            openAuth("register");
        }
    );


    document
        .getElementById("authClose")
        .addEventListener(
            "click",
            closeAuth
        );


    logoutBtn.addEventListener(
        "click",
        async function () {

            logoutBtn.disabled = true;

            try {

                const response = await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "same-origin"
                    }
                );

                const data =
                    await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.error ||
                        "Ошибка выхода"
                    );
                }

                currentUser = null;

                updateAuthUI();

            } catch (error) {

                console.error(
                    "Ошибка выхода:",
                    error
                );

                alert(
                    error.message ||
                    "Не удалось выйти"
                );

            } finally {

                logoutBtn.disabled = false;
            }
        }
    );


    submit.addEventListener(
        "click",
        async function () {

            const name =
                username.value.trim();

            const pass =
                password.value;

            if (!name || !pass) {

                message.textContent =
                    "Введите логин и пароль";

                return;
            }

            submit.disabled = true;

            message.textContent =
                "Подождите...";

            try {

                const endpoint =
                    mode === "login"
                        ? "/api/login"
                        : "/api/register";

                const response =
                    await fetch(
                        endpoint,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body: JSON.stringify({
                                username: name,
                                password: pass,
                                country:
                                    document.getElementById(
                                        "countrySelect"
                                    )?.value ||
                                    "unknown",
                                gender:
                                    document.getElementById(
                                        "genderSelect"
                                    )?.value ||
                                    "none"
                            })
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data.error ||
                        "Ошибка сервера"
                    );
                }

                currentUser =
                    data.user;

                message.textContent =
                    mode === "login"
                        ? "Вход выполнен!"
                        : "Регистрация выполнена!";

                updateAuthUI();

                setTimeout(
                    closeAuth,
                    700
                );

            } catch (error) {

                message.textContent =
                    error.message ||
                    "Ошибка сервера";

            } finally {

                submit.disabled = false;
            }
        }
    );


    updateAuthUI();

    checkSession();

})();
</script>
