<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео-рулетка</title>
</head>
<body>

<h1>🎥 Видео-рулетка</h1>

<div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
</div>

<p id="status">Готов к подключению</p>

<h2>👤 Мой профиль</h2>

<label for="countrySelect">Моя страна:</label>
<select id="countrySelect">
    <option value="NL">🇳🇱 Нидерланды</option>
    <option value="RU">🇷🇺 Россия</option>
    <option value="UA">🇺🇦 Украина</option>
    <option value="DE">🇩🇪 Германия</option>
    <option value="FR">🇫🇷 Франция</option>
    <option value="US">🇺🇸 США</option>
    <option value="GB">🇬🇧 Великобритания</option>
    <option value="PL">🇵🇱 Польша</option>
    <option value="KZ">🇰🇿 Казахстан</option>
    <option value="TR">🇹🇷 Турция</option>
</select>

<br><br>

<label for="genderSelect">Мой пол:</label>
<select id="genderSelect">
    <option value="male">👨 Мужчина</option>
    <option value="female">👩 Женщина</option>
    <option value="none">Не указывать</option>
</select>

<h2>🔎 Кого искать</h2>

<label for="searchCountrySelect">Страна собеседника:</label>
<select id="searchCountrySelect">
    <option value="any">🌍 Любая страна</option>
    <option value="NL">🇳🇱 Нидерланды</option>
    <option value="RU">🇷🇺 Россия</option>
    <option value="UA">🇺🇦 Украина</option>
    <option value="DE">🇩🇪 Германия</option>
    <option value="FR">🇫🇷 Франция</option>
    <option value="US">🇺🇸 США</option>
    <option value="GB">🇬🇧 Великобритания</option>
    <option value="PL">🇵🇱 Польша</option>
    <option value="KZ">🇰🇿 Казахстан</option>
    <option value="TR">🇹🇷 Турция</option>
</select>

<br><br>

<label for="searchGenderSelect">Пол собеседника:</label>
<select id="searchGenderSelect">
    <option value="any">👥 Любой</option>
    <option value="male">👨 Мужчина</option>
    <option value="female">👩 Женщина</option>
    <option value="none">Не указан</option>
</select>

<p id="partnerInfo">Собеседник ещё не найден</p>

<button id="findBtn">🎥 Найти собеседника</button>
<button id="nextBtn">➡️ Следующий</button>
<button id="testBtn">🧪 Тест соединения</button>

<script src="app.js"></script>

</body>
</html>
